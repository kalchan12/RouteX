[project]
name = "routex-engine"
version = "0.1.0"
description = "RouteX simulation engine — graph-based traffic simulation and route optimization simulator."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv.workspace]
members = ["apps/api"]

[tool.setuptools]
packages = [
    "engine",
    "engine.simulation",
    "engine.network",
    "engine.vehicles",
    "engine.traffic",
    "engine.routing",
    "engine.optimization",
    "engine.analytics",
    "engine.ai",
    "scenarios",
]

[tool.setuptools.package-data]
scenarios = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["apps/web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
